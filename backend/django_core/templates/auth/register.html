{% extends "base.html" %}

{% block title %}Sign Up - Codiction{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="bg-secondary rounded-2xl p-8 border border-slate-800">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2">Create Account</h1>
                <p class="text-slate-400">Start your interview prep journey</p>
            </div>
            
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        required
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-accent transition"
                        placeholder="you@example.com"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        minlength="8"
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-accent transition"
                        placeholder="At least 8 characters"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Confirm Password</label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        required
                        minlength="8"
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-accent transition"
                        placeholder="Retype password"
                    >
                </div>
                
                <div id="error" class="hidden bg-red-900/50 text-red-200 border border-red-800 p-3 rounded text-sm"></div>
                
                <button 
                    type="submit"
                    id="submit-btn"
                    class="w-full py-3 bg-accent text-primary rounded-lg font-bold hover:bg-sky-400 transition"
                >
                    Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm">
                <span class="text-slate-400">Already have an account?</span>
                <a href="/login/" class="text-accent hover:underline ml-1">Log in</a>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const password_confirm = document.getElementById('password_confirm').value;
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submit-btn');
        
        errorDiv.classList.add('hidden');
        
        // Client-side validation
        if (password !== password_confirm) {
            errorDiv.textContent = 'Passwords do not match.';
            errorDiv.classList.remove('hidden');
            return;
        }
        
        if (password.length < 8) {
            errorDiv.textContent = 'Password must be at least 8 characters.';
            errorDiv.classList.remove('hidden');
            return;
        }
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        
        try {
            const response = await fetch('/api/accounts/register/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password, password_confirm }),
            });
            
            const data = await response.json();
            
            if (response.ok && data.tokens) {
                // Save tokens and redirect
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                window.location.href = '/problems/';
            } else {
                let errorMsg = 'Registration failed.';
                if (data.email) errorMsg = data.email[0];
                else if (data.password) errorMsg = data.password[0];
                else if (data.detail) errorMsg = data.detail;
                
                errorDiv.textContent = errorMsg;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        } catch (err) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
        }
    });
</script>
{% endblock %}
