{% extends "base.html" %}

{% block title %}Login - Codiction{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="bg-secondary rounded-2xl p-8 border border-slate-800">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
                <p class="text-slate-400">Log in to continue your journey</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        required
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-accent transition"
                        placeholder="you@example.com"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-accent transition"
                        placeholder="Your password"
                    >
                </div>
                
                <div id="error" class="hidden bg-red-900/50 text-red-200 border border-red-800 p-3 rounded text-sm"></div>
                
                <button 
                    type="submit"
                    id="submit-btn"
                    class="w-full py-3 bg-accent text-primary rounded-lg font-bold hover:bg-sky-400 transition"
                >
                    Log In
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm">
                <span class="text-slate-400">Don't have an account?</span>
                <a href="/register/" class="text-accent hover:underline ml-1">Sign up free</a>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submit-btn');
        
        errorDiv.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Logging in...';
        
        try {
            const response = await fetch('/api/accounts/login/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password }),
            });
            
            const data = await response.json();
            
            if (response.ok && data.tokens) {
                // Save tokens
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                
                // Redirect to problems
                window.location.href = '/problems/';
            } else {
                errorDiv.textContent = data.detail || data.email?.[0] || 'Login failed. Check your credentials.';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Log In';
            }
        } catch (err) {
            errorDiv.textContent = 'Network error. Please try again.';
            errorDiv.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
        }
    });
</script>
{% endblock %}
